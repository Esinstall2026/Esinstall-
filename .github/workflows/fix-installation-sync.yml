name: Apply installation sync correction

on:
  push:
    branches:
      - codex/v11-final

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'chore(v10): apply installation job sync correction'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch installation workflow sync
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()
          old = '''  const updateInstallation = (value: Installation) => {\n    const next = installations.some(i => i.jobId === value.jobId) ? installations.map(i => i.jobId === value.jobId ? value : i) : [...installations, value];\n    setInstallations(next); write("es-install-installations-v1", next);\n  };'''
          new = '''  const updateInstallation = (value: Installation) => {\n    const next = installations.some(i => i.jobId === value.jobId) ? installations.map(i => i.jobId === value.jobId ? value : i) : [...installations, value];\n    setInstallations(next); write("es-install-installations-v1", next);\n\n    const job = jobs.find(j => j.id === value.jobId);\n    if (job) {\n      const nextStatus: JobStatus =\n        value.status === "Completed"\n          ? "Completed"\n          : value.status === "In Progress"\n            ? "Installation"\n            : job.status === "Completed" || job.status === "Warranty"\n              ? job.status\n              : "Ready for Installation";\n      if (job.status !== nextStatus) updateJob({ ...job, status: nextStatus });\n    }\n  };'''
          if old not in text:
              raise SystemExit('Expected updateInstallation block was not found; aborting.')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Remove one-time patch workflow
        run: rm .github/workflows/fix-installation-sync.yml

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/fix-installation-sync.yml
          git commit -m "fix(v10): sync installation completion to job status"
          git push